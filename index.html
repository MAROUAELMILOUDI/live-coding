<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Utilisateurs — MockAPI</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Utilisateurs</h1>

  <form id="userForm">
    <input type="text" id="name" placeholder="Nom">
    <input type="email" id="email" placeholder="Email">
    <button type="submit" id="submitBtn">Ajouter</button>
  </form>

  <p id="message"></p>

  <table id="usersTable">
    <thead>
      <tr><th>Nom</th><th>Email</th><th>Actions</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</body>
</html>
